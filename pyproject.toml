[project]
name = "turnprobe"
version = "0.1.0"
description = "Probe realtime speech APIs for turn-taking behavior: when they cut you off, when they yield, and how fast."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "soundfile>=0.12",
    "websockets>=14.0",
    "python-dotenv>=1.0",
]

[project.urls]
Repository = "https://github.com/sahasrarjn/turnprobe"
"Blog post" = "https://www.sahasrarjn.com/blog/realtime-turn-detection/"

[project.scripts]
turnprobe = "turnprobe.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/turnprobe"]
